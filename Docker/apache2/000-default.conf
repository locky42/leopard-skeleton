<VirtualHost *:80>
    ServerAdmin webmaster@project.com
    # ServerName project.com
    DocumentRoot /var/www/html/public
    
    ErrorLog /var/www/html/storage/logs/apache2/error.log
    CustomLog /var/www/html/storage/logs/apache2/access.log combined

    RemoteIPHeader CF-Connecting-IP

    <FilesMatch \.php$>
        SetHandler application/x-httpd-php
    </FilesMatch>

    <FilesMatch "^\.(.*)$">
        Require all denied
    </FilesMatch>
    
    <DirectoryMatch "/\.(.*)">
        Require all denied
    </DirectoryMatch>

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
